<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKP QC Test Certificates</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f5;--card:#fff;--tx:#1d2521;--mut:#66726b;--br:#d5dcd8;--ac:#1f7a4d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a17;--card:#1f2622;--tx:#e8eeea;--mut:#98a69d;--br:#33403a;--ac:#4cc38a}}
:root[data-theme="dark"]{--bg:#151a17;--card:#1f2622;--tx:#e8eeea;--mut:#98a69d;--br:#33403a;--ac:#4cc38a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--br)}
h1{font-size:18px;margin:0}
main{max-width:980px;margin:0 auto;padding:16px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--br);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.d{color:#c0392b}
input,select{font:inherit;padding:8px;border:1px solid var(--br);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar input{flex:1;min-width:160px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--br);white-space:nowrap}
.sub{font-size:12px;color:var(--mut)}
h3{margin:14px 0 8px;font-size:14px}
#status{font-size:12px;color:var(--mut)}
/* certificate */
#cert{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-bottom:20px}#cert.on{display:block}.pbar{position:sticky;top:0;z-index:2;display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--br);margin-bottom:12px}.pwrap{overflow-x:auto;padding:0 8px}
.sheet{background:#bff0c0;color:#000;width:190mm;margin:0 auto;padding:10mm 12mm;font:13px Arial,sans-serif;line-height:1.9}
.sheet h2{text-align:center;margin:0;font-size:24px;line-height:1.2}
.sheet .c{text-align:center}
.sheet .row{display:flex;gap:6px;align-items:baseline}
.sheet .v{flex:1;border-bottom:1px dotted #000;min-height:18px;padding:0 4px;font-weight:600}
.sheet .box{border:1.5px solid #000;min-height:32px;padding:2px 8px;font-weight:600;flex:1}
.sheet hr{border:0;border-top:1.5px solid #000;margin:4px 0 10px}
.chem{display:grid;grid-template-columns:1fr 1fr;column-gap:30px;padding:0 8mm}
.sheet .sig{margin-top:6px;text-align:right}.sheet .sig .stamp{display:block;margin:0 0 -4px auto;width:32mm;height:auto;position:relative;left:-14mm}.sheet .sig div{min-height:16px;line-height:1.2}
.sheet .sig span{display:inline-block;border-top:1.5px solid #000;padding-top:2px;min-width:60mm;text-align:center}
@media print{
 :root{padding:0}
 body{background:#fff}
 header,main{display:none!important}
 #cert{display:block!important;position:static;overflow:visible;background:#fff;padding:0}.pbar{display:none!important}.pwrap{overflow:visible;padding:0}
 .sheet{width:100%;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 @page{size:A4;margin:8mm}
}
</style></head><body>
<header><h1>SKP Merchants – QC Test Certificates</h1><span id="status">Loading…</span></header>
<main>
 <section id="listView">
  <div class="bar">
   <input id="q" placeholder="Search cert no, customer, material, truck, invoice…">
   <button class="p" id="newBtn">+ New certificate</button>
   <button id="csvBtn">Export CSV</button>
  </div>
  <div class="card tw"><table><thead><tr><th>No.</th><th>Date</th><th>Customer</th><th>Material</th><th>Qty</th><th>Truck</th><th></th></tr></thead><tbody id="rows"></tbody></table><p class="sub" id="empty" style="display:none">No certificates yet. Click “New certificate”.</p></div>
 </section>
 <section id="formView" style="display:none">
  <div class="card">
   <div class="grid">
    <div><label>Certificate No.</label><input id="f_no"></div>
    <div><label>Date</label><input id="f_date" type="date"></div>
    <div><label>Customer's Name</label><input id="f_cust"></div>
    <div><label>Address</label><input id="f_addr"></div>
    <div><label>Materials</label><input id="f_mat" list="mats"><datalist id="mats"><option>Ferro Chrome</option><option>Ferro Silicon</option><option>Silico Manganese</option><option>High Carbon Ferro Manganese</option></datalist></div>
    <div><label>Packing – Bags</label><input id="f_bags"></div>
    <div><label>Packing – Kgs</label><input id="f_kgs"></div>
    <div><label>Total Quantity</label><input id="f_qty"></div>
    <div><label>Physical Properties</label><input id="f_phys"></div>
   </div>
   <h3>Size</h3>
   <div class="grid"><div><label>From (mm)</label><input id="f_s1"></div><div><label>To (mm)</label><input id="f_s2"></div><div><label>+ (%)</label><input id="f_s3"></div></div>
   <h3>Chemical Composition (%)</h3>
   <div class="grid" id="chemInputs"></div>
   <h3>Dispatch</h3>
   <div class="grid">
    <div><label>Tax Invoice No.</label><input id="f_inv"></div><div><label>Invoice Date</label><input id="f_invd" type="date"></div>
    <div><label>Order No.</label><input id="f_ord"></div><div><label>Order Date</label><input id="f_ordd" type="date"></div>
    <div><label>Truck No.</label><input id="f_truck"></div><div><label>Chemist</label><input id="f_chem"></div>
   </div>
  </div>
  <div class="bar"><button class="p" id="saveBtn">Save</button><button id="savePrintBtn">Save &amp; Print</button><button id="printNowBtn">Print A4 preview</button><button id="cancelBtn">Cancel</button></div>
 </section>
</main>
<div id="cert"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const ELS=[["Si","SI"],["Mn","Mn"],["C","C"],["Al","Al"],["S","S"],["P","P"],["Cr","Cr"],["Others","Others"],["V","V"],["Ni","NI"],["Ash","Ash"],["Mo","Mo"],["Ti","TI"],["Mois","Mois"],["VM","VM"],["Fc","Fc"]];
const LEFT=["Si","Mn","C","Al","S","P","Cr","Others"],RIGHT=["V","Ni","Ash","Mo","Ti","Mois","VM","Fc"];
const LBL=Object.fromEntries(ELS);
const F=["no","date","cust","addr","mat","bags","kgs","qty","phys","s1","s2","s3","inv","invd","ord","ordd","truck","chem"];
const $=id=>document.getElementById(id);
let recs=[],editing=null,store=null,useDb=false;
const esc=s=>String(s==="[object Object]"||(s&&typeof s==="object")?"":(s??"")).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtD=d=>d?d.split("-").reverse().join("/"):"";

/* ---- storage: shared db when available, else browser localStorage ---- */
const LS="skp_qc_certs";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return[]}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(recs))}catch(e){}}
const local={
 async put(r){const i=recs.findIndex(x=>x.id===r.id);i<0?recs.push(r):recs[i]=r;lsSave();render()},
 async del(id){recs=recs.filter(x=>x.id!==id);lsSave();render()}
};
recs=lsLoad();
(async()=>{
 store=local;$("status").textContent="Saved in this browser";render();
 try{
  const db=window.claude&&await claude.use("db");
  if(!db)return;
  const col=db.collection("qc_certs");
  store={async put(r){await col.doc(r.id).set(r)},async del(id){await col.doc(id).delete()}};
  useDb=true;
  col.onSnapshot(s=>{recs=s.docs.map(d=>d.data());$("status").textContent="Database connected";render()},
   e=>{store=local;useDb=false;recs=lsLoad();$("status").textContent="Saved in this browser";render()});
 }catch(e){}
})();

/* ---- list ---- */
function render(){
 const q=$("q").value.toLowerCase();
 const list=recs.filter(r=>!q||JSON.stringify([r.no,r.cust,r.mat,r.truck,r.inv,r.ord]).toLowerCase().includes(q))
  .sort((a,b)=>(b.date||"").localeCompare(a.date||"")||String(b.no).localeCompare(String(a.no),undefined,{numeric:true}));
 $("empty").style.display=list.length?"none":"block";
 $("rows").innerHTML=list.map(r=>`<tr><td>${esc(r.no)}</td><td>${fmtD(r.date)}</td><td>${esc(r.cust)}</td><td>${esc(r.mat)}</td><td>${esc(r.qty)}</td><td>${esc(r.truck)}</td>
 <td><button data-a="e" data-id="${r.id}">Edit</button> <button data-a="p" data-id="${r.id}">Print</button> <button class="d" data-a="d" data-id="${r.id}">Delete</button></td></tr>`).join("");
}
$("rows").onclick=e=>{
 const b=e.target.closest("button");if(!b)return;const r=recs.find(x=>x.id===b.dataset.id);if(!r)return;
 if(b.dataset.a==="e")openForm(r);
 if(b.dataset.a==="p")printCert(r);
 if(b.dataset.a==="d"&&confirm("Delete certificate "+r.no+"?"))store.del(r.id);
};
$("q").oninput=render;

/* ---- form ---- */
$("chemInputs").innerHTML=ELS.map(([k,l])=>`<div><label>${l} %</label><input id="c_${k}" inputmode="decimal"></div>`).join("");
function nextNo(){const n=recs.map(r=>parseInt(r.no)).filter(x=>!isNaN(x));return String((n.length?Math.max(...n):0)+1)}
function openForm(r){
 editing=r||null;
 const d=r||{no:nextNo(),date:new Date().toISOString().slice(0,10)};
 F.forEach(k=>{const v=d[k];$("f_"+k).value=(typeof v==="string"&&v!=="[object Object]")||typeof v==="number"?v:""});
 ELS.forEach(([k])=>$("c_"+k).value=(d.chemical||{})[k]||"");
 $("listView").style.display="none";$("formView").style.display="block";scrollTo(0,0);
}
function collect(){
 const r=editing?{...editing}:{id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)};
 F.forEach(k=>r[k]=$("f_"+k).value.trim());
 r.chemical={};ELS.forEach(([k])=>r.chemical[k]=$("c_"+k).value.trim());
 r.updated=new Date().toISOString();return r;
}
function closeForm(){$("formView").style.display="none";$("listView").style.display="block"}
async function save(){
 const r=collect();
 if(!r.no||!r.cust){alert("Certificate No. and Customer's Name are required.");return null}
 try{await store.put(r)}catch(e){alert("Could not save: "+(e.message||e.code));return null}
 return r;
}
$("newBtn").onclick=()=>openForm(null);
$("cancelBtn").onclick=closeForm;
$("printNowBtn").onclick=()=>printCert(collect());
$("saveBtn").onclick=async()=>{if(await save())closeForm()};
$("savePrintBtn").onclick=async()=>{const r=await save();if(r){closeForm();printCert(r)}};

/* ---- certificate print ---- */
function line(l,v,extra=""){return `<div class="row"><span>${l}</span><span class="v">${esc(v)}</span>${extra}</div>`}
function chemCol(keys,r){return `<div>${keys.map(k=>`<div class="row"><span>${LBL[k]}</span><span class="v">${esc((r.chemical||{})[k])}</span><span>%</span></div>`).join("")}</div>`}
function printCert(r){
 $("cert").innerHTML=`<div class="pbar"><button class="p" id="doPrint">🖨 Print A4</button><button id="doPdf">⬇ Download PDF</button><button id="closePrev">Close</button><span class="sub" style="align-self:center">A4 page · in the print dialog use Scale 100% and default margins</span></div><div class="pwrap"><div class="sheet">
 <div class="row" style="justify-content:space-between"><span>No. <b>${esc(r.no)}</b></span><b style="font-size:18px">TEST CERTIFICATE</b><span>Date ${fmtD(r.date)}</span></div>
 <h2>SKP MERCHANTS PVT. LTD.</h2>
 <div class="c">132-A, S.P. Mukherjee Road, Kolkata - 700 026<br>Phone : 033-40168000/100/148, 149</div><hr>
 ${line("CUSTOMER'S NAME",r.cust)}${line("ADDRESS",r.addr)}
 <div class="row" style="margin:6px 0 0 8mm"><span>MATERIALS :</span><div class="box">${esc(r.mat)}</div></div>
 <div style="margin-left:8mm">
 <div class="row"><span>PACKING DETAILS</span><span style="flex:.4"></span><span>Bags</span><span class="v">${esc(r.bags)}</span><span>Kgms</span><span class="v" style="flex:.6">${esc(r.kgs)}</span></div>
 ${line("TOTAL QUANTITY",r.qty)}${line("PHYSICAL PROPERTIES",r.phys)}
 <div class="row"><span>SIZE</span><span class="v">${esc(r.s1)}</span><span>m.m. to</span><span class="v">${esc(r.s2)}</span><span>m.m. +</span><span class="v">${esc(r.s3)}</span><span>%</span></div></div>
 <div style="margin-top:6px"><b><u>CHEMICAL COMPOSITION</u></b></div>
 <div class="chem">${chemCol(LEFT,r)}${chemCol(RIGHT,r)}</div>
 <div class="row" style="margin-top:6px"><span>TAX INVOICE NO</span><span class="v">${esc(r.inv)}</span><span>DATE</span><span class="v" style="flex:.6">${fmtD(r.invd)}</span></div>
 <div class="row"><span>ORDER NO</span><span class="v">${esc(r.ord)}</span><span>DATE</span><span class="v" style="flex:.6">${fmtD(r.ordd)}</span></div>
 <div class="row"><span>TRUCK NO</span><span class="v" style="flex:.7">${esc(r.truck)}</span><span style="flex:.3"></span></div>

/* ---- PDF ---- */
async function makePdf(r,btn){
 const old=btn.textContent;btn.disabled=true;btn.textContent="Creating PDF…";
 try{
  if(!window.html2canvas||!window.jspdf)throw new Error("PDF library did not load (check internet connection).");
  const el=document.querySelector("#cert .sheet");
  const cv=await html2canvas(el,{scale:2,backgroundColor:"#bff0c0"});
  const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  const w=194,h=Math.min(cv.height*w/cv.width,281);
  pdf.addImage(cv.toDataURL("image/jpeg",0.95),"JPEG",8,8,w,h);
  const blob=pdf.output("blob"),name="QC-Certificate-"+String(r.no).replace(/[^\w-]/g,"_")+".pdf";
  let done=false;
  try{const d=await claude.use("downloads");if(d){await d.save({filename:name,data:blob});done=true}}catch(e){if(e&&e.code==="declined")done=true}
  if(!done){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>window.open(a.href,"_blank"),300)}
 }catch(e){alert("Could not create PDF: "+(e.message||e))}
 btn.disabled=false;btn.textContent=old;
}

/* ---- CSV export ---- */
$("csvBtn").onclick=async()=>{
 const h=["No","Date","Customer","Address","Material","Bags","Kgs","Total Qty","Physical","Size From","Size To","Size +%",...ELS.map(e=>e[1]+" %"),"Invoice No","Invoice Date","Order No","Order Date","Truck No","Chemist"];
 const rows=recs.map(r=>[r.no,r.date,r.cust,r.addr,r.mat,r.bags,r.kgs,r.qty,r.phys,r.s1,r.s2,r.s3,...ELS.map(([k])=>(r.chemical||{})[k]),r.inv,r.invd,r.ord,r.ordd,r.truck,r.chem]);
 const csv=[h,...rows].map(a=>a.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
 try{const d=await claude.use("downloads");if(d){await d.save({filename:"qc-certificates.csv",data:csv});return}}catch(e){}
 const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="qc-certificates.csv";a.click();
};
